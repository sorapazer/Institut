<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Artikelvorlage · Zeitschrift für Sinnzentrierte Psychologie</title>
<!--
  Druckvorlage für Beiträge der Zeitschrift für Sinnzentrierte Psychologie.
  Aufruf: artikel-vorlage.html#<artikel-id>  (Daten aus ../data/journal.js)
  Die PDFs erzeugt werkzeuge/pdf-erzeugen.js mit Chromium.
-->
<link rel="stylesheet" href="../css/fonts.css">
<style>
  :root {
    --ink: #17202a; --soft: #4b5661; --petrol: #1d4d57; --brass: #8a6a33; --line: #cfd5d4; --tint: #eef3f3;
    --serif: "Newsreader", Georgia, serif; --sans: "IBM Plex Sans", Arial, sans-serif;
  }
  @page {
    size: A4; margin: 24mm 18mm 22mm 18mm;
    @top-left { font: 400 7.5pt "IBM Plex Sans", Arial, sans-serif; color: #4b5661; vertical-align: bottom; padding-bottom: 4mm; }
    @top-right { font: italic 400 8pt "Newsreader", Georgia, serif; color: #4b5661; vertical-align: bottom; padding-bottom: 4mm; }
    @bottom-center { content: counter(page); font: 500 8.5pt "IBM Plex Sans", Arial, sans-serif; color: #17202a; }
  }
  @page :first {
    @top-left { content: none; } @top-right { content: none; }
  }
  html { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { margin: 0; color: var(--ink); font: 400 9.6pt/1.42 var(--serif); hyphens: auto; -webkit-hyphens: auto; }

  /* Kopf der ersten Seite */
  .mast { display: flex; justify-content: space-between; align-items: flex-end; border-bottom: 2.2pt double var(--ink); padding-bottom: 2.5mm; }
  .mast .logo { display: flex; align-items: center; gap: 3mm; }
  .mast .jt { font: 500 12.5pt/1.1 var(--serif); }
  .mast .jt small { display: block; font: 400 6.6pt/1.4 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--soft); }
  .mast .meta { text-align: right; font: 400 7.4pt/1.45 var(--sans); color: var(--soft); }
  .rubrik { margin-top: 9mm; font: 600 7.6pt/1 var(--sans); letter-spacing: .16em; text-transform: uppercase; color: var(--brass); }
  h1.titel { margin: 3mm 0 0; font: 500 22pt/1.12 var(--serif); letter-spacing: -.01em; text-wrap: balance; }
  .untertitel { margin: 2.5mm 0 0; font: italic 400 12.5pt/1.3 var(--serif); color: var(--soft); text-wrap: balance; }
  .autoren { margin-top: 5mm; font: 500 9.5pt/1.3 var(--sans); }
  .affil { font: 400 8pt/1.4 var(--sans); color: var(--soft); }

  .abstracts { margin: 7mm 0 6mm; background: var(--tint); border-top: 1.4pt solid var(--petrol); padding: 4.5mm 5mm; display: grid; grid-template-columns: 1fr 1fr; gap: 6mm; font: 400 8pt/1.45 var(--sans); }
  .abstracts h2 { margin: 0 0 1.5mm; font: 600 7.4pt/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--petrol); }
  .abstracts p { margin: 0 0 1.6mm; text-align: left; hyphens: auto; }
  .abstracts .kw { margin-top: 2mm; color: var(--soft); }
  .abstracts .kw b { color: var(--ink); font-weight: 600; }
  .abstracts.single { grid-template-columns: 1fr; font-size: 8.4pt; }

  /* Fließtext */
  .body { column-count: 2; column-gap: 7mm; column-rule: 0.4pt solid var(--line); text-align: left; }
  .body h2 { font: 600 9.2pt/1.25 var(--sans); color: var(--petrol); margin: 4.5mm 0 1.6mm; break-after: avoid; text-align: left; hyphens: manual; }
  .body h2:first-child { margin-top: 0; }
  .body p { margin: 0; text-indent: 4mm; orphans: 2; widows: 2; }
  .body h2 + p { text-indent: 0; }
  .body p:first-of-type::first-letter { }
  .lit { column-count: 2; column-gap: 7mm; margin-top: 6mm; border-top: 0.6pt solid var(--ink); padding-top: 3mm; }
  .lit h2 { column-span: all; font: 600 9.2pt/1.2 var(--sans); color: var(--petrol); margin: 0 0 2mm; }
  .lit ol { list-style: none; margin: 0; padding: 0; }
  .lit li { font: 400 7.6pt/1.4 var(--sans); padding-left: 4mm; text-indent: -4mm; margin-bottom: 1.3mm; break-inside: avoid; text-align: left; hyphens: manual; }

  .abschluss { margin-top: 7mm; display: grid; grid-template-columns: 1.2fr 1fr; gap: 6mm; font: 400 7.4pt/1.45 var(--sans); color: var(--soft); border-top: 0.6pt solid var(--line); padding-top: 3mm; break-inside: avoid; }
  .abschluss b { color: var(--ink); font-weight: 600; display: block; letter-spacing: .1em; text-transform: uppercase; font-size: 6.6pt; margin-bottom: 1mm; }
  .first-foot { margin-top: 0; }
</style>
</head>
<body>
<article id="doc"></article>
<script src="../data/journal.js"></script>
<script src="../data/en/journal.js"></script>
<script src="../data/fr/journal.js"></script>
<script>
/* Aufruf: artikel-vorlage.html#<sprache>:<id>   sprache = en (Original), de, fr (Übersetzungen)
   rg = englische Preprint-Fassung für Repositorien (ResearchGate, Zenodo): Sora Pazer als alleinige Autorin bzw. alleiniger Autor, ohne Zeitschriftenangaben */
(function () {
  var J = window.JOURNAL, raw = decodeURIComponent(location.hash.slice(1));
  var m = /^(en|de|fr|rg):(.+)$/.exec(raw) || [null, "en", raw];
  var RG = m[1] === "rg", L = RG ? "en" : m[1], id = m[2];
  var a = J.artikel.filter(function (x) { return x.id === id; })[0] || J.artikel[0];
  var iss = J.ausgaben.filter(function (x) { return x.id === a.ausgabe; })[0];
  var JE = (window.EN && window.EN.journal) || { artikel: {} }, JF = (window.FR && window.FR.journal) || { artikel: {} };
  var ae = JE.artikel[a.id] || {}, af = JF.artikel[a.id] || {};
  var S = {
    en: { jt: "Journal of Meaning-Centered Psychology", pub: "Published by the Institute for Meaning-Centered Psychology", inst: "Institute for Meaning-Centered Psychology",
          vol: "Volume", issue: "Issue", pp: "pp.", oa: "Open access", refs: "References", cite: "How to cite", lic: "License, correspondence and use of AI",
          and: " and ", mon: { "April": "April", "Oktober": "October" },
          rub: { "Editorial": "Editorial", "Übersichtsarbeit": "Review", "Originalarbeit": "Original article", "Theoretischer Beitrag": "Theoretical article", "Methodenbeitrag": "Methods article", "Praxis und Lehre": "Practice and teaching", "Rezension": "Book review" },
          licText: "Published open access under the Creative Commons Attribution 4.0 International license (CC BY 4.0). Correspondence: Editorial office, Journal of Meaning-Centered Psychology. This article was written with the assistance of generative AI and reviewed by the authors, who take full responsibility for its content.",
          note: "" },
    de: { jt: "Zeitschrift für Sinnzentrierte Psychologie", pub: "Herausgegeben vom Institut für Sinnzentrierte Psychologie", inst: "Institut für Sinnzentrierte Psychologie",
          vol: "Jahrgang", issue: "Heft", pp: "S.", oa: "Open Access", refs: "Literatur", cite: "Zitiervorschlag (Originalfassung)", lic: "Lizenz, Korrespondenz und Einsatz von KI",
          and: " und ", mon: { "April": "April", "Oktober": "Oktober" }, rub: null,
          licText: "Erscheint im offenen Zugang unter der Lizenz Creative Commons Namensnennung 4.0 International (CC BY 4.0). Korrespondenz: Redaktion der Zeitschrift. Dieser Beitrag wurde mit Unterstützung generativer KI verfasst und von den Autorinnen und Autoren geprüft, die die volle Verantwortung für den Inhalt tragen.",
          note: "Deutsche Übersetzung. Maßgeblich ist die englische Originalfassung." },
    fr: { jt: "Revue de psychologie centrée sur le sens", pub: "Publiée par l'Institut de psychologie centrée sur le sens", inst: "Institut de psychologie centrée sur le sens",
          vol: "Volume", issue: "Numéro", pp: "p.", oa: "Libre accès", refs: "Références", cite: "Citation (version originale)", lic: "Licence, correspondance et utilisation de l'IA",
          and: " et ", mon: { "April": "avril", "Oktober": "octobre" },
          rub: { "Editorial": "Éditorial", "Übersichtsarbeit": "Article de synthèse", "Originalarbeit": "Article original", "Theoretischer Beitrag": "Article théorique", "Methodenbeitrag": "Article méthodologique", "Praxis und Lehre": "Pratique et enseignement", "Rezension": "Compte rendu" },
          licText: "Publié en libre accès sous licence Creative Commons Attribution 4.0 International (CC BY 4.0). Correspondance : rédaction de la revue. Cet article a été rédigé avec l'aide de l'IA générative et relu par les auteurs, qui en assument l'entière responsabilité.",
          note: "Traduction française. La version originale anglaise fait foi." }
  }[L];
  function e(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function paras(t) { return String(t || "").split(/\n\s*\n/).map(function (p) { return "<p>" + e(p) + "</p>"; }).join(""); }
  function q(t) { return '"' + String(t).replace(/\\/g, "\\\\").replace(/"/g, '\\"') + '"'; }
  var src = L === "en" ? ae : L === "fr" ? af : a;
  var titel = src.titel || a.titel, untertitel = src.untertitel || a.untertitel, abschnitte = src.abschnitte || a.abschnitte;
  var start = L === "en" && !RG ? (parseInt(String(a.seiten).split(/[–-]/)[0], 10) || 1) : 1;
  var heft = iss.jahrgang + "(" + iss.heft + "), " + iss.jahr;
  var kurz = titel.length > 70 ? titel.slice(0, 68).replace(/\s+\S*$/, "") + " …" : titel;
  var autoren = RG ? "Sora Pazer" : a.autoren.replace(" und ", S.and);
  var monat = (S.mon[iss.monat] || iss.monat) + " " + iss.jahr;
  if (RG) {
    S.cite = "How to cite";
    S.lic = "Status, license and use of AI";
    S.licText = "Preprint, not peer reviewed. Made available open access under the Creative Commons Attribution 4.0 International license (CC BY 4.0). This article was written with the assistance of generative AI and reviewed by the author, who takes full responsibility for its content. Correspondence: Sora Pazer, Institute for Meaning-Centered Psychology, https://imcp-institute.org";
    heft = "Preprint · " + monat;
  }
  var cite = RG ? "Pazer, S. (" + iss.jahr + "). " + (ae.titel || a.titel) + ((ae.untertitel || a.untertitel) ? ": " + (ae.untertitel || a.untertitel) : "") + " [Preprint]. Institute for Meaning-Centered Psychology." : (a.autorenApa || a.autoren) + " (" + iss.jahr + "). " + (ae.titel || a.titel) + ((ae.untertitel || a.untertitel) ? ": " + (ae.untertitel || a.untertitel) : "") + ". Journal of Meaning-Centered Psychology, " + iss.jahrgang + "(" + iss.heft + "), " + a.seiten + ".";
  var logo = '<svg width="26" height="26" viewBox="0 0 40 40"><circle cx="20" cy="24" r="13" fill="none" stroke="#17202a" stroke-width="1.6"/><line x1="20" y1="2" x2="20" y2="37" stroke="#1d4d57" stroke-width="2"/><circle cx="20" cy="4" r="2.4" fill="#8a6a33"/></svg>';
  var style = document.createElement("style");
  style.textContent = "@page { @top-left { content: " + q((RG ? "S. Pazer" : S.jt) + " · " + heft) + "; } @top-right { content: " + q(kurz) + "; } } @page :first { counter-increment: page " + start + "; @top-left { content: none; } @top-right { content: none; } }";
  document.head.appendChild(style);
  document.documentElement.lang = L;
  var h = RG ? '<header class="mast"><div class="logo">' + logo + '<div class="jt">' + S.inst + "<small>Preprint · not peer reviewed</small></div></div>" +
    '<div class="meta">' + monat + "<br>Open access · CC BY 4.0</div></header>" : '<header class="mast"><div class="logo">' + logo + '<div class="jt">' + S.jt + "<small>" + S.pub + "</small></div></div>" +
    '<div class="meta">' + S.vol + " " + iss.jahrgang + " · " + S.issue + " " + iss.heft + " · " + (S.mon[iss.monat] || iss.monat) + " " + iss.jahr + "<br>" + S.pp + " " + e(a.seiten) + (L === "en" ? "" : " (Original)") + " · " + S.oa + " · CC BY 4.0</div></header>";
  h += '<div class="rubrik">' + e(S.rub ? S.rub[a.rubrik] || a.rubrik : a.rubrik) + '</div><h1 class="titel">' + e(titel) + "</h1>" + (untertitel ? '<p class="untertitel">' + e(untertitel) + "</p>" : "");
  h += '<div class="autoren">' + e(autoren) + '</div><div class="affil">' + S.inst + "</div>";
  if (S.note) h += '<p class="affil" style="margin-top:2mm;font-style:italic">' + S.note + "</p>";
  var absEn = '<div lang="en"><h2>Abstract</h2>' + paras(a.abstractEn) + (a.keywords ? '<p class="kw"><b>Keywords:</b> ' + e(a.keywords.join(" · ")) + "</p>" : "") + "</div>";
  var absDe = '<div lang="de"><h2>Zusammenfassung</h2>' + paras(a.abstract) + (a.schluesselwoerter ? '<p class="kw"><b>Schlüsselwörter:</b> ' + e(a.schluesselwoerter.join(" · ")) + "</p>" : "") + "</div>";
  var absFr = '<div lang="fr"><h2>Résumé</h2>' + paras(af.abstract) + (af.keywords ? '<p class="kw"><b>Mots-clés :</b> ' + e(af.keywords.join(" · ")) + "</p>" : "") + "</div>";
  h += '<section class="abstracts' + (L === "en" ? " single" : "") + '">' + (L === "en" ? absEn : L === "de" ? absDe + absEn : absFr + absEn) + "</section>";
  h += '<div class="body">';
  (abschnitte || []).forEach(function (s) { h += "<h2>" + e(s.titel) + "</h2>" + (s.absaetze || []).map(function (p) { return "<p>" + e(p) + "</p>"; }).join(""); });
  h += "</div>";
  if (a.literatur && a.literatur.length) h += '<section class="lit"><h2>' + S.refs + "</h2><ol>" + a.literatur.map(function (r) { return "<li>" + e(r) + "</li>"; }).join("") + "</ol></section>";
  h += '<footer class="abschluss"><div><b>' + S.cite + "</b>" + e(cite) + "</div><div><b>" + S.lic + "</b>" + S.licText + "</div></footer>";
  document.getElementById("doc").innerHTML = h;
  document.title = titel;
  window.ARTIKEL_BEREIT = true;
})();
</script>
</body>
</html>
